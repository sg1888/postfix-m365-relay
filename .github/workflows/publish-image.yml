name: publish image

# Two ways a release is published, both through the same gates:
#   1. A maintainer pushes a v* tag. That tag is built and published.
#   2. Automatic refresh. Daily, the "plan" job asks each published variant of
#      the newest release which distro updates it is missing
#      (.github/scripts/pending-updates.sh). If any is a key package (Postfix,
#      SASL, OpenSSL, the CA bundle, Python cryptography, curl, glibc, ...) or a
#      security fix, it releases the next patch version (v1.1.0 -> v1.1.1) from
#      the same source commit with current packages. Otherwise nothing happens.
# Nothing is pushed before it passes: the full test suite (every distro, fresh
# packages, Trivy), then per variant a from-scratch build whose exact layers are
# scanned, container-tested and package-checked on every platform before the
# push (.github/actions/build-test-push). An automatic release's git tag is
# created last, only after every variant was published.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: release a refresh even if no key or security update is pending
        type: boolean
        default: false

# A refresh and a release must never publish the same tags at the same time.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE_NAME: postfix-m365-relay

jobs:
  # What to publish, if anything. A tag push publishes that tag. A scheduled or
  # manual run checks the newest stable release for pending updates and, if a
  # release is warranted, picks the next patch version of it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      stable: ${{ steps.plan.outputs.stable }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
      base_version: ${{ steps.plan.outputs.base_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - id: plan
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          FORCE: ${{ inputs.force || false }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            # The tag an automatic refresh creates (job tag-release) also
            # arrives here as a tag push; its images are already published.
            if git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' | grep -q '^Automatic package refresh of '; then
              { echo "publish=false"; echo "version=${GITHUB_REF_NAME}"; echo "sha=${GITHUB_SHA}"
                echo "stable=true"; echo "create_tag=false"; echo "base_version="; } >> "$GITHUB_OUTPUT"
              echo "${GITHUB_REF_NAME} was created by an automatic refresh, which already published it." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            version="${GITHUB_REF_NAME}"
            case "$version" in *-*) stable=false ;; *) stable=true ;; esac
            {
              echo "publish=true"; echo "version=$version"; echo "sha=${GITHUB_SHA}"
              echo "stable=$stable"; echo "create_tag=false"; echo "base_version="
            } >> "$GITHUB_OUTPUT"
            echo "Release $version pushed by tag." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- - | head -n1)
          [ -n "$last" ] || { echo "::error::no stable release tag to refresh"; exit 1; }
          sha=$(git rev-list -n1 "$last")
          v=${last#v}

          # A refresh rebuilds the release's own source. Releases older than the
          # package upgrade in the build cannot pick up updates, so refreshing
          # one would re-release the same packages every day. Skip until a
          # manual release contains it.
          if ! git show "$sha:build/postfix-m365-relay/build-scripts/postfix-install.sh" | grep -q packages-refreshed; then
            {
              echo "publish=false"; echo "version=$last"; echo "sha=$sha"
              echo "stable=true"; echo "create_tag=false"; echo "base_version=$last"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::$last predates automatic package refreshes; cut a release by hand first."
            echo "$last predates automatic package refreshes; nothing to do until a newer release exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          : > updates.txt
          variants=("$v linux/amd64" "$v-alma-v3 linux/amd64" "$v-alma-v2 linux/amd64/v2")
          # Debian and Alpine exist only for releases whose own workflow builds
          # them; an older release has no such tag to check.
          for extra in debian alpine; do
            if git show "$sha:.github/workflows/publish-image.yml" | grep -q "^  build-$extra:"; then
              variants+=("$v-$extra linux/amd64")
            fi
          done
          for variant in "${variants[@]}"; do
            read -r tag platform <<< "$variant"
            echo "## $tag" >> updates.txt
            if ! .github/scripts/pending-updates.sh "$IMAGE:$tag" "$platform" >> updates.txt; then
              echo "image $IMAGE:$tag could not be checked [unchecked]" >> updates.txt
            fi
          done

          # A check that could not run is not a reason to release: on
          # 2026-10-13 it released 1.2.1 with nothing pending. Fail instead, so
          # GitHub emails the maintainer; tomorrow's run tries again.
          if grep -q '\[unchecked\]' updates.txt; then
            { echo '```'; cat updates.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::a published image could not be checked for updates; nothing released"
            exit 1
          fi

          if grep -Eq '\[(key|security)\]' updates.txt || [ "$FORCE" = true ]; then
            IFS=. read -r major minor patch <<< "$v"
            next="v${major}.${minor}.$((patch + 1))"
            # A tag of that name can only exist if a previous refresh pushed it and
            # then failed; never reuse it.
            if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
              echo "::error::$next already exists but is not the newest release; fix the tags by hand"
              exit 1
            fi
            publish=true
          else
            next="$last"; publish=false
          fi
          {
            echo "publish=$publish"; echo "version=$next"; echo "sha=$sha"
            echo "stable=true"; echo "create_tag=$publish"; echo "base_version=$last"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$publish" = true ]; then
              echo "Refresh: releasing $next (from $last, commit ${sha:0:12}) with current packages."
            else
              echo "No key or security update pending for $last; nothing to release."
            fi
            echo; echo '```'; cat updates.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pending-updates
          path: updates.txt
          if-no-files-found: ignore

  # GitHub disables scheduled workflows in a public repository after 60 days
  # without repository activity, which would silently stop the refreshes. When
  # main has had no commit for 45 days, the daily run commits an updated
  # docs/REFRESH-STATUS.md (when it last checked, the newest release, what was
  # pending). Authored as the maintainer. Pushed with GITHUB_TOKEN, which starts
  # no workflow. GitHub still emails before disabling; re-enable it under
  # Actions > publish image if that ever happens.
  keepalive:
    needs: plan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: pending-updates
        continue-on-error: true
      - env:
          RELEASE: ${{ needs.plan.outputs.base_version }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          NEXT: ${{ needs.plan.outputs.version }}
        run: |
          age_days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "last commit on main: $age_days days ago"
          [ "$age_days" -ge 45 ] || exit 0
          {
            echo "# Package refresh status"
            echo
            echo "Written by the daily run of \`.github/workflows/publish-image.yml\` when"
            echo "\`main\` has had no commit for 45 days, so that GitHub keeps the schedule"
            echo "enabled (see the keepalive job in .github/workflows/publish-image.yml)."
            echo
            echo "- Checked: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Newest release: ${RELEASE:-unknown}"
            if [ "$PUBLISH" = true ]; then
              echo "- Result: releasing $NEXT"
            else
              echo "- Result: no key or security update pending"
            fi
            if [ -s updates.txt ]; then
              echo; echo "## Pending updates"; echo; echo '```'; cat updates.txt; echo '```'
            fi
          } > docs/REFRESH-STATUS.md
          git config user.name "sg1888"
          git config user.email "sg1888@users.noreply.github.com"
          git add docs/REFRESH-STATUS.md
          git commit -m "chore: refresh status $(date -u +%Y-%m-%d)" -m "Keeps the scheduled package refresh enabled (GitHub disables schedules after 60 days without activity)."
          git push origin HEAD:main

  # Release gate: the exact same suite as CI (host unit tests + every-variant
  # container suites + Trivy), built without layer cache so it tests today's
  # packages.
  suite:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/suite.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      fresh: true

  # Default image. Ubuntu is the x86-64 v1 baseline, so one manifest runs on every
  # amd64 CPU (including default-CPU VMs) plus arm64 — no micro-arch tag split. It
  # owns the unsuffixed tags: latest, {{version}}, {{major}}.{{minor}}, {{major}},
  # and the moving `ubuntu` alias.
  build-ubuntu:
    needs: [plan, suite]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      # attest-build-provenance persists the attestation through the GitHub
      # attestations API, which requires this scope in addition to id-token.
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # latest=false: only the explicit `type=raw,value=latest` (Ubuntu job)
          # may claim the `latest` tag. Without this, metadata-action's default
          # latest=auto adds `latest` to EVERY job on a version tag, so all three
          # build jobs race for `latest` and the last writer (Alma) wins -- which
          # is how `latest` silently became the Alma image. The Ubuntu job still
          # gets latest via its explicit raw tag; the Alma jobs must never claim it.
          flavor: latest=false
          # The built commit, which on a refresh is the release's, not main's.
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{version}}-ubuntu,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}-ubuntu,value=${{ needs.plan.outputs.version }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.stable == 'true' }}
            type=raw,value=ubuntu,enable=${{ needs.plan.outputs.stable == 'true' }}
      - id: build
        uses: ./.github/actions/build-test-push
        with:
          base-image: ubuntu:24.04
          platforms: linux/amd64,linux/arm64
          test-platform: linux/amd64
          package-assert: >-
            . /usr/share/postfix-m365-relay/sasl-xoauth2.source &&
            test -n "$commit" && test -e "$libdir/libsasl-xoauth2.so" &&
            ! ldd "$libdir/libsasl-xoauth2.so" | grep -q 'not found' &&
            python3 -c 'import cryptography' && command -v saslpasswd2 >/dev/null
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest GHCR provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Print digest to pin
        run: echo "MAIL_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

  # Optimized AlmaLinux build (x86-64-v3 baseline; needs AVX2) plus arm64. Opt-in
  # via the moving `alma-v3` tag and versioned `-alma-v3` tags. Never claims the
  # unsuffixed/latest tags.
  build-alma-v3:
    # Gate on build-ubuntu: it owns latest/{{version}}/{{major}}.{{minor}}. If it
    # fails, skip the Alma publishes too, so a release is all-or-nothing and never
    # ships new alma-vN tags beside a stale latest.
    needs: [plan, build-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # latest=false: only the explicit `type=raw,value=latest` (Ubuntu job)
          # may claim the `latest` tag. Without this, metadata-action's default
          # latest=auto adds `latest` to EVERY job on a version tag, so all three
          # build jobs race for `latest` and the last writer (Alma) wins -- which
          # is how `latest` silently became the Alma image. The Ubuntu job still
          # gets latest via its explicit raw tag; the Alma jobs must never claim it.
          flavor: latest=false
          # The built commit, which on a refresh is the release's, not main's.
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}-alma-v3,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}-alma-v3,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}-alma-v3,value=${{ needs.plan.outputs.version }}
            type=raw,value=alma-v3,enable=${{ needs.plan.outputs.stable == 'true' }}
      - id: build
        uses: ./.github/actions/build-test-push
        with:
          base-image: almalinux:10
          platforms: linux/amd64,linux/arm64
          test-platform: linux/amd64
          package-assert: >-
            rpm -q sasl-xoauth2 >/dev/null &&
            python3 -c 'import cryptography' && command -v saslpasswd2 >/dev/null
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest GHCR provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # AlmaLinux x86-64-v2 rebuild (needs only SSE4.2) from AlmaLinux's official
  # altarch 10 base. amd64-only; opt-in via the moving `alma-v2` tag and versioned
  # `-alma-v2` tags. This replaces the old `-x86-64-v2` suffix tags.
  build-alma-v2:
    # Gate on build-ubuntu for the same all-or-nothing reason as build-alma-v3.
    needs: [plan, build-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # latest=false: only the explicit `type=raw,value=latest` (Ubuntu job)
          # may claim the `latest` tag. Without this, metadata-action's default
          # latest=auto adds `latest` to EVERY job on a version tag, so all three
          # build jobs race for `latest` and the last writer (Alma) wins -- which
          # is how `latest` silently became the Alma image. The Ubuntu job still
          # gets latest via its explicit raw tag; the Alma jobs must never claim it.
          flavor: latest=false
          # The built commit, which on a refresh is the release's, not main's.
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}-alma-v2,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}-alma-v2,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}-alma-v2,value=${{ needs.plan.outputs.version }}
            type=raw,value=alma-v2,enable=${{ needs.plan.outputs.stable == 'true' }}
      - id: build
        uses: ./.github/actions/build-test-push
        with:
          base-image: almalinux/10-base:10
          # EXPECT_ALMALINUX_ARCH prevents a superficially successful v2-tagged
          # build from using the normal v3 base. This exact omission produced a
          # glibc "CPU does not support x86-64-v3" failure during local testing.
          extra-build-args: EXPECT_ALMALINUX_ARCH=x86_64_v2
          platforms: linux/amd64/v2
          test-platform: linux/amd64/v2
          package-assert: >-
            test "$(rpm -q --qf '%{ARCH}' almalinux-release)" = x86_64_v2 &&
            test "$(rpm -q --qf '%{ARCH}' sasl-xoauth2)" = x86_64_v2 &&
            rpm -q sasl-xoauth2 >/dev/null &&
            rpm -q --qf '%{RELEASE}' sasl-xoauth2 | grep -q '\.alma_altarch' &&
            python3 -c 'import cryptography' && command -v saslpasswd2 >/dev/null
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Debian 13 build: x86-64 v1 baseline like Ubuntu, newer Postfix (3.10), plus
  # arm64. Opt-in via the moving `debian` tag and versioned `-debian` tags.
  build-debian:
    # Gate on build-ubuntu for the same all-or-nothing reason as build-alma-v3.
    needs: [plan, build-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # latest=false: only the Ubuntu job may claim `latest` (see build-ubuntu).
          flavor: latest=false
          # The built commit, which on a refresh is the release's, not main's.
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}-debian,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}-debian,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}-debian,value=${{ needs.plan.outputs.version }}
            type=raw,value=debian,enable=${{ needs.plan.outputs.stable == 'true' }}
      - id: build
        uses: ./.github/actions/build-test-push
        with:
          base-image: debian:trixie-slim
          platforms: linux/amd64,linux/arm64
          test-platform: linux/amd64
          package-assert: >-
            . /usr/share/postfix-m365-relay/sasl-xoauth2.source &&
            test -n "$commit" && test -e "$libdir/libsasl-xoauth2.so" &&
            ! ldd "$libdir/libsasl-xoauth2.so" | grep -q 'not found' &&
            python3 -c 'import cryptography' && command -v saslpasswd2 >/dev/null
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest GHCR provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Alpine build: the smallest image (musl libc), Postfix 3.10, amd64 + arm64.
  # Opt-in via the moving `alpine` tag and versioned `-alpine` tags.
  build-alpine:
    # Gate on build-ubuntu for the same all-or-nothing reason as build-alma-v3.
    needs: [plan, build-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # latest=false: only the Ubuntu job may claim `latest` (see build-ubuntu).
          flavor: latest=false
          # The built commit, which on a refresh is the release's, not main's.
          labels: |
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}-alpine,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}-alpine,value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}-alpine,value=${{ needs.plan.outputs.version }}
            type=raw,value=alpine,enable=${{ needs.plan.outputs.stable == 'true' }}
      - id: build
        uses: ./.github/actions/build-test-push
        with:
          base-image: alpine:3.22
          platforms: linux/amd64,linux/arm64
          test-platform: linux/amd64
          package-assert: >-
            . /usr/share/postfix-m365-relay/sasl-xoauth2.source &&
            test -n "$commit" && test -e "$libdir/libsasl-xoauth2.so" &&
            ! ldd "$libdir/libsasl-xoauth2.so" | grep -q 'not found' &&
            python3 -c 'import cryptography' && command -v saslpasswd2 >/dev/null
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest GHCR provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  dockerhub-description:
    needs: [plan, build-ubuntu, build-alma-v3, build-alma-v2, build-debian, build-alpine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # Pinned to the audited v5 commit; a moved tag cannot slip in unreviewed
      # code that would run with the Docker Hub credential.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # Editing the description needs a Read/Write/Delete PAT; a plain
          # push/pull PAT returns Forbidden. DOCKERHUB_TOKEN must carry delete
          # scope. The account password is deliberately not used here.
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: docs/DOCKERHUB.md
          short-description: Self-contained Postfix app-only OAuth relay for Microsoft 365

  # Guardrail against a silently-wrong latest. build-ubuntu writes both `latest`
  # and `ubuntu` to the same digest, so after a successful release they must be
  # equal. If a past build-ubuntu failure ever left `latest` stale (e.g. pointing
  # at an old Alma image), the digests diverge and this job fails the run loudly
  # instead of leaving latest quietly wrong. Only meaningful on a real version tag
  # (the one that actually pushes the moving latest/ubuntu tags).
  verify-latest:
    needs: [plan, build-ubuntu, build-alma-v3, build-alma-v2, build-debian, build-alpine]
    if: ${{ needs.plan.outputs.stable == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: latest must equal the freshly published ubuntu image
        run: |
          img="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          latest=$(docker buildx imagetools inspect "$img:latest" --format '{{.Manifest.Digest}}')
          ubuntu=$(docker buildx imagetools inspect "$img:ubuntu" --format '{{.Manifest.Digest}}')
          echo "latest digest: $latest"
          echo "ubuntu digest: $ubuntu"
          if [ "$latest" != "$ubuntu" ]; then
            echo "::error::latest ($latest) != ubuntu build ($ubuntu) -- latest is stale or wrong"
            exit 1
          fi
          echo "ok: latest points at the ubuntu build"

  # Automatic refresh only: record the release in git, last, so a tag exists
  # only for a version whose every variant passed and was published. Created
  # with GITHUB_TOKEN, which by design does not trigger this workflow again.
  tag-release:
    needs: [plan, build-ubuntu, build-alma-v3, build-alma-v2, build-debian, build-alpine, verify-latest]
    if: needs.plan.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # GITHUB_TOKEN may not create this tag: the release commit's workflow
      # files differ from main's, and GitHub refuses any ref "changing a
      # workflow" without the workflows permission, which GITHUB_TOKEN never
      # has (2026-10-13). RELEASE_TOKEN needs Contents and Workflows: read and
      # write. Its tag push starts this workflow again; job plan recognises a
      # refresh tag and publishes nothing.
      - name: RELEASE_TOKEN is required
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: '[ -n "$RELEASE_TOKEN" ] || { echo "::error::set the RELEASE_TOKEN secret (Contents and Workflows: read and write)"; exit 1; }'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: pending-updates
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
          BASE: ${{ needs.plan.outputs.base_version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # The tag is recorded as the maintainer's, like every manual release.
          git config user.name "sg1888"
          git config user.email "sg1888@users.noreply.github.com"
          {
            echo "postfix-m365-relay $VERSION"
            echo
            echo "Automatic package refresh of $BASE: same source, current distro packages."
            echo "Pending updates that triggered it:"
            echo
            grep -E '^## |\[(key|security)\]' updates.txt || true
          } > tag-message.txt
          git tag -a "$VERSION" -F tag-message.txt "$SHA"
          git push origin "$VERSION"
          echo "Tagged $VERSION at ${SHA:0:12}." >> "$GITHUB_STEP_SUMMARY"

  # GitHub release page for every published version, so the history says what
  # changed and why. A manual release gets GitHub's generated notes (commits and
  # pull requests since the previous tag); an automatic refresh gets the package
  # updates that triggered it. Both list the digest to pin. Created with the
  # RELEASE_TOKEN secret when set (a fine-grained token of the maintainer with
  # contents: write, so the release shows as theirs), else GITHUB_TOKEN (shows as
  # github-actions). Creating a release triggers no workflow, so a personal
  # token is safe here.
  release-notes:
    needs: [plan, build-ubuntu, build-alma-v3, build-alma-v2, build-debian, build-alpine, verify-latest, tag-release]
    if: >-
      always() && needs.plan.outputs.publish == 'true' &&
      needs.build-ubuntu.result == 'success' && needs.build-alma-v3.result == 'success' &&
      needs.build-alma-v2.result == 'success' &&
      needs.build-debian.result == 'success' && needs.build-alpine.result == 'success' &&
      (needs.verify-latest.result == 'success' || needs.verify-latest.result == 'skipped') &&
      (needs.tag-release.result == 'success' || needs.tag-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: the notes list the commits since the previous
      # release and read the operator's notes from the tag message.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.create_tag == 'true'
        with:
          name: pending-updates
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          BASE: ${{ needs.plan.outputs.base_version }}
          REFRESH: ${{ needs.plan.outputs.create_tag }}
          STABLE: ${{ needs.plan.outputs.stable }}
          DIGEST: ${{ needs.build-ubuntu.outputs.digest }}
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; leaving it as it is"
            exit 0
          fi
          if [ "$REFRESH" = true ]; then
            {
              echo "Automatic package refresh of $BASE. Same source code; the image was"
              echo "rebuilt with current distro packages because these updates were pending"
              echo "([key] = a package the relay depends on directly, [security] = a distro"
              echo "security fix):"
              echo
              echo '```'
              grep -E '^## |\[(key|security)\]' updates.txt || true
              echo '```'
              echo
              echo "<details><summary>All pending updates</summary>"
              echo
              echo '```'
              cat updates.txt
              echo '```'
              echo "</details>"
              echo
              echo "Pin: \`MAIL_IMAGE=$IMAGE@$DIGEST\`"
              echo
              echo "Tags: \`${VERSION#v}\`, \`${VERSION#v}-debian\`, \`${VERSION#v}-alpine\`, \`${VERSION#v}-alma-v3\`, \`${VERSION#v}-alma-v2\` (Docker Hub and GHCR)."
            } > notes.md
          else
            # Released by hand: the maintainer's notes from the tag (may be
            # empty), the commits since the previous release, and the digest.
            .github/scripts/release-notes.sh "$VERSION" "$IMAGE" "$DIGEST" > notes.md
          fi
          args=(--title "$VERSION" --notes-file notes.md --verify-tag)
          [ "$STABLE" = true ] || args+=(--prerelease)
          gh release create "$VERSION" "${args[@]}"
