name: suite

# Reusable test suite. Called by test.yml on every PR/push (so this definition is
# continuously exercised) and by publish-image.yml as a release gate (the build
# jobs there depend on it, so a v* tag cannot publish images unless this passes).
on:
  workflow_call:
    inputs:
      ref:
        # The commit to test. Empty means the triggering commit. The scheduled
        # rebuild in publish-image.yml passes the release tag it rebuilds.
        description: git ref to check out and test
        type: string
        required: false
        default: ''
      fresh:
        # true: build from a freshly pulled base with no layer cache, so Trivy
        # scans today's packages. The release gate sets it; PR/push runs keep
        # the cache for speed.
        description: build without the layer cache
        type: boolean
        required: false
        default: false

# Each test step runs only if the checked-out ref has that test. The scheduled
# rebuild tests an older release tag with this (newer) file, and a test added
# since that release has nothing to test there. For pushes and PRs (ref empty)
# every step always runs, so a missing or renamed test still fails CI.
jobs:
  # Host-side unit tests for the pure shell helpers (lib/text.sh). Container-free
  # and distro-independent, so they run as a fast standalone job.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Shell unit tests (bats)
        if: inputs.ref == '' || hashFiles('tests/bats-unit.sh') != ''
        run: ./tests/bats-unit.sh
      # Offline, tests/static.sh proves vendor/sasl-xoauth2/src matches the
      # recorded tree hash. This adds the online half: upstream's commit really
      # has that tree.
      - name: Vendored sasl-xoauth2 matches upstream
        run: vendor/sasl-xoauth2/update.sh --verify
      # Upstream's unit tests under ASan/LSan/UBSan: memory errors, leaks and
      # undefined behaviour the tests reach fail the run. The image is untouched.
      - name: Vendored sasl-xoauth2 under sanitizers
        if: inputs.ref == '' || hashFiles('tests/sasl-xoauth2-sanitizers.sh') != ''
        run: ./tests/sasl-xoauth2-sanitizers.sh
      # libFuzzer on the token file, the server challenge and a refresh reply.
      - name: Fuzz vendored sasl-xoauth2
        if: inputs.ref == '' || hashFiles('tests/sasl-xoauth2-fuzz.sh') != ''
        run: FUZZ_SECONDS=120 ./tests/sasl-xoauth2-fuzz.sh

  container:
    runs-on: ubuntu-latest
    # Every base image is gated on every change. The runner is native amd64, so
    # this is where the images get real x86-64 validation (local arm64 Macs can
    # only emulate amd64, under which the Rust cryptography extension
    # segfaults). fail-fast: false so one variant's failure still reports the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ubuntu
            base: ubuntu:24.04
          - variant: alma
            base: almalinux:10
          - variant: debian
            base: debian:trixie-slim
          - variant: alpine
            base: alpine:3.22
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Static checks run before package downloads so basic syntax failures are
      # reported quickly and do not consume Buildx/QEMU time.
      - name: Static audit
        if: inputs.ref == '' || hashFiles('tests/static.sh') != ''
        run: ./tests/static.sh
      # YAML parsing catches indentation; Compose's own parser additionally
      # validates service, mount, network, secret, and interpolation semantics.
      - name: Validate Compose model
        run: docker compose config --quiet

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build release image (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/postfix-m365-relay/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          platforms: linux/amd64
          load: true
          tags: postfix-m365-relay:test
          cache-from: type=gha,scope=tests-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=tests-${{ matrix.variant }}
          pull: ${{ inputs.fresh }}
          no-cache: ${{ inputs.fresh }}
          provenance: false

      # Vulnerability scan of the freshly built image. ignore-unfixed keeps the
      # gate actionable -- it fails only on CRITICAL/HIGH findings that actually
      # have a fix available, so an unpatched upstream CVE does not block
      # unrelated work while a fixable one does. Relax severity/exit-code here if
      # this proves too aggressive.
      - name: Vulnerability scan (Trivy)
        # Pinned to the audited v0.36.0 commit so a moved tag cannot slip in
        # unreviewed action code.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: postfix-m365-relay:test
          format: table
          # Vulnerability scan only. Secret scanning otherwise flags the Debian
          # ssl-cert snakeoil placeholder key (auto-installed by the postfix dep,
          # regenerated per install, never used by this relay) as a HIGH finding.
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # These suites use only example.invalid identities and --network none for
      # credential logic. They never contact Microsoft or a production relay.
      - name: Offline Python credential tests
        if: inputs.ref == '' || hashFiles('tests/python-unit.sh') != ''
        run: ./tests/python-unit.sh postfix-m365-relay:test
      - name: XOAUTH2 plugin provenance and loading
        if: inputs.ref == '' || hashFiles('tests/container-sasl-plugin.sh') != ''
        run: ./tests/container-sasl-plugin.sh postfix-m365-relay:test
      - name: Image size budget and trimming
        if: inputs.ref == '' || hashFiles('tests/container-image-size.sh') != ''
        run: ./tests/container-image-size.sh postfix-m365-relay:test
      - name: Sender-name and regexp-map tests
        if: inputs.ref == '' || hashFiles('tests/container-sender-names.sh') != ''
        run: ./tests/container-sender-names.sh postfix-m365-relay:test
      - name: Optional-sender and sender-allowlist tests
        if: inputs.ref == '' || hashFiles('tests/container-optional-sender.sh') != ''
        run: ./tests/container-optional-sender.sh postfix-m365-relay:test
      - name: Real Postfix-to-XOAUTH2 sink integration
        if: inputs.ref == '' || hashFiles('tests/container-end-to-end.sh') != ''
        run: ./tests/container-end-to-end.sh postfix-m365-relay:test
      - name: Rejected XOAUTH2 defers, then delivers
        if: inputs.ref == '' || hashFiles('tests/container-auth-rejected.sh') != ''
        run: ./tests/container-auth-rejected.sh postfix-m365-relay:test
      - name: Token-file faults on a read-only root
        if: inputs.ref == '' || hashFiles('tests/container-token-faults.sh') != ''
        run: ./tests/container-token-faults.sh postfix-m365-relay:test
      - name: Token rotation under concurrent load
        if: inputs.ref == '' || hashFiles('tests/container-token-rotation-load.sh') != ''
        run: ./tests/container-token-rotation-load.sh postfix-m365-relay:test
      # This separate drill removes and recreates the relay around an actually
      # deferred message. It guards the named spool volume contract that a
      # normal happy-path protocol test cannot prove.
      - name: Persistent spool replacement and recovery
        if: inputs.ref == '' || hashFiles('tests/container-spool-recovery.sh') != ''
        run: ./tests/container-spool-recovery.sh postfix-m365-relay:test
      - name: Durable alert incidents and independent channels
        if: inputs.ref == '' || hashFiles('tests/container-alert-incidents.sh') != ''
        run: ./tests/container-alert-incidents.sh postfix-m365-relay:test
      - name: Automatic alert trigger matrix
        if: inputs.ref == '' || hashFiles('tests/container-alert-trigger-matrix.sh') != ''
        run: ./tests/container-alert-trigger-matrix.sh postfix-m365-relay:test
      - name: OAuth rotation alert
        if: inputs.ref == '' || hashFiles('tests/container-oauth-rotation-alert.sh') != ''
        run: ./tests/container-oauth-rotation-alert.sh postfix-m365-relay:test
      - name: Managed inbound TLS rotation alert
        if: inputs.ref == '' || hashFiles('tests/container-inbound-tls-rotation-alert.sh') != ''
        run: ./tests/container-inbound-tls-rotation-alert.sh postfix-m365-relay:test
      - name: Invalid passthrough alias alert
        if: inputs.ref == '' || hashFiles('tests/container-invalid-alias-alert.sh') != ''
        run: ./tests/container-invalid-alias-alert.sh postfix-m365-relay:test
      - name: Outbound STARTTLS certificate matrix
        if: inputs.ref == '' || hashFiles('tests/container-upstream-tls.sh') != ''
        run: ./tests/container-upstream-tls.sh postfix-m365-relay:test
      - name: Configuration matrix
        if: inputs.ref == '' || hashFiles('tests/container-config-matrix.sh') != ''
        run: ./tests/container-config-matrix.sh postfix-m365-relay:test
      - name: First-run persistent configuration
        if: inputs.ref == '' || hashFiles('tests/container-first-run-config.sh') != ''
        run: ./tests/container-first-run-config.sh postfix-m365-relay:test
      - name: SASL user and Docker-secret lifecycle
        if: inputs.ref == '' || hashFiles('tests/container-sasl-user-lifecycle.sh') != ''
        run: ./tests/container-sasl-user-lifecycle.sh postfix-m365-relay:test
      - name: Remote network policy truth tables
        if: inputs.ref == '' || hashFiles('tests/container-network-policy.sh') != ''
        run: ./tests/container-network-policy.sh postfix-m365-relay:test
      - name: Certificate import and separation matrix
        if: inputs.ref == '' || hashFiles('tests/container-certificates.sh') != ''
        run: ./tests/container-certificates.sh postfix-m365-relay:test
      - name: Inbound fullchain and renewal handshake
        if: inputs.ref == '' || hashFiles('tests/container-inbound-fullchain.sh') != ''
        run: ./tests/container-inbound-fullchain.sh postfix-m365-relay:test
      - name: Security, supervisor, and read-only tests
        if: inputs.ref == '' || hashFiles('tests/container-policy.sh') != ''
        run: ./tests/container-policy.sh postfix-m365-relay:test
