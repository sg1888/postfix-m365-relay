# Complete published-device posture: trusted LAN only. Replace every TEST-NET
# address before use and never expose this listener to the Internet.
services:
  postfix-m365-relay:
    image: docker.io/sg1888/postfix-m365-relay:latest
    container_name: postfix-m365-relay
    restart: unless-stopped

    # Syntax is HOST_LAN_IP:HOST_PORT:CONTAINER_PORT. Never shorten this to
    # 2525:2525, which publishes on every interface. Host port 587 may replace
    # the middle 2525 for a device that insists on the submission port.
    ports:
      - "192.0.2.10:2525:2525"

    environment:
      # Both source IP and a per-device password are required in this example.
      MAIL_INBOUND_AUTH: ip-and-auth
      MAIL_INBOUND_TLS: require
      MAIL_TRUSTED_NETWORKS: 192.0.2.50/32,192.0.2.51/32
      MAIL_SMTPD_USERS_FILE: /run/secrets/smtpd_users
      # Omit these two paths to use the separately generated self-signed server
      # certificate. For Certbot, see compose.letsencrypt.yaml.
      # MAIL_INBOUND_TLS_CERT: /etc/letsencrypt/live/smtp.example.com/fullchain.pem
      # MAIL_INBOUND_TLS_KEY: /etc/letsencrypt/live/smtp.example.com/privkey.pem

    secrets:
      - smtpd_users
    volumes:
      - ../config:/config
      - mail-relay-state:/var/lib/mail-relay
      - mail-relay-spool:/var/spool/postfix
    tmpfs:
      - /run/mail-relay:rw,nosuid,noexec,mode=0750
    networks:
      mail-relay:
        aliases: [postfix-m365-relay]
    healthcheck:
      test: ["CMD-SHELL", "printf 'QUIT\\r\\n' | nc -w 3 127.0.0.1 $${RELAY_PORT:-2525} | grep -q '^220 '"]
      interval: 60s
      timeout: 10s
      retries: 3

secrets:
  smtpd_users:
    file: ./secrets/smtpd_users

networks:
  mail-relay:
    # Ordinary bridge: the relay still needs outbound Microsoft connectivity.

volumes:
  mail-relay-state:
  mail-relay-spool:
