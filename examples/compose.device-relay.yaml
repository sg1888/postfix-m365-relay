# Device relay: trusted LAN only. Replace all TEST-NET addresses and never expose
# this listener to the Internet.
services:
  postfix-m365-relay:
    image: docker.io/sg1888/postfix-m365-relay:latest
    container_name: postfix-m365-relay
    restart: unless-stopped

    # Format is HOST_LAN_IP:HOST_PORT:CONTAINER_PORT. Don't shorten to 2525:2525
    # (that opens every interface). Use 587 if your device demands the submission port.
    ports:
      - "192.0.2.10:2525:2525"

    environment:
      # This example requires both source IP and per-device password.
      MAIL_INBOUND_AUTH: ip-and-auth
      MAIL_INBOUND_TLS: require
      MAIL_TRUSTED_NETWORKS: 192.0.2.50/32,192.0.2.51/32
      MAIL_SMTPD_USERS_FILE: /run/secrets/smtpd_users
      # Skip these to use the auto-generated self-signed cert. See
      # compose.letsencrypt.yaml for Certbot integration.
      # MAIL_INBOUND_TLS_CERT: /etc/letsencrypt/live/smtp.example.com/fullchain.pem
      # MAIL_INBOUND_TLS_KEY: /etc/letsencrypt/live/smtp.example.com/privkey.pem

    secrets:
      - smtpd_users
    volumes:
      - ../config:/config
      - mail-relay-state:/var/lib/mail-relay
      - mail-relay-spool:/var/spool/postfix
    tmpfs:
      - /run/mail-relay:rw,nosuid,noexec,mode=0750
    networks:
      mail-relay:
        aliases: [postfix-m365-relay]
    healthcheck:
      test: ["CMD-SHELL", "printf 'QUIT\\r\\n' | nc -w 3 127.0.0.1 $${RELAY_PORT:-2525} | grep -q '^220 '"]
      interval: 60s
      timeout: 10s
      retries: 3

secrets:
  smtpd_users:
    file: ./secrets/smtpd_users

networks:
  mail-relay:
    # Standard bridge; the relay needs outbound Microsoft access.

volumes:
  mail-relay-state:
  mail-relay-spool:
