# Hardened two-network deployment. Application containers join an INTERNAL
# bridge that Docker gives no route to the internet, so a compromised app
# cannot phone home; its only outbound capability is handing mail to the relay.
# The relay additionally joins a second, ordinary bridge (`egress`) that carries
# the NAT path to Microsoft 365. Nothing is published to the host or LAN.
services:
  postfix-m365-relay:
    image: ${MAIL_IMAGE:-docker.io/sg1888/postfix-m365-relay:latest}
    container_name: postfix-m365-relay
    restart: unless-stopped

    volumes:
      # Human-edited settings and optional device-password source file.
      - ./mail-relay:/config
      # OAuth private key/rotation state and deferred message bodies must both
      # survive image upgrades and container replacement.
      - mail-relay-state:/var/lib/mail-relay
      - mail-relay-spool:/var/spool/postfix

    # tmpfs mounts this path in RAM, never on the host disk, and wipes it the
    # moment the container stops. Live secrets and throwaway runtime state live
    # here: OAuth access tokens, supervisor PIDs, the SASL user DB (sasldb2),
    # and rendered CA material. Keeping them off disk means a stolen disk image
    # or backup holds no usable credentials, and every restart regenerates them
    # clean. nosuid + noexec block privilege escalation and running binaries
    # from the mount; mode=0750 restricts access to the relay's own user/group.
    tmpfs:
      - /run/mail-relay:rw,nosuid,noexec,mode=0750

    # The relay MUST sit on BOTH networks: `mail-relay` to receive app mail, and
    # `egress` to reach Microsoft 365. Remove either and intake or delivery
    # breaks. Docker routes the relay's default (internet) traffic through
    # `egress` automatically, because the internal bridge has no gateway.
    networks:
      mail-relay:
        aliases: [postfix-m365-relay]
      egress: {}

    healthcheck:
      test: ["CMD-SHELL", "printf 'QUIT\\r\\n' | nc -w 3 127.0.0.1 $${RELAY_PORT:-2525} | grep -q '^220 '"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Example sandboxed application. It joins ONLY the internal network, so it has
  # no internet access whatsoever — its sole outbound path is SMTP to the relay
  # at `postfix-m365-relay:2525`. Swap in your real service; keep it off
  # `egress` so it stays internet-isolated.
  example-app:
    image: alpine:3
    depends_on:
      - postfix-m365-relay
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - mail-relay

networks:
  # Internal bridge: Docker installs no gateway/NAT, so members cannot reach the
  # internet. App-to-relay traffic still flows freely (internal blocks only
  # OUTBOUND external routing, not container-to-container). `name:` is pinned so
  # separate compose projects can attach with `external: true, name: mail-relay`;
  # drop `name:` if you never wire relay and apps across project boundaries.
  # `driver:` is omitted because bridge is already the default on a single host.
  mail-relay:
    name: mail-relay
    internal: true
  # Ordinary bridge, with NAT to the internet. KEEP THIS NETWORK RELAY-ONLY:
  # Postfix auto-trusts every subnet the relay sits on (`mynetworks`), so any
  # stray container placed here would become a trusted, un-authenticated sender.
  egress:
    name: mail-relay-egress

volumes:
  mail-relay-state:
    name: mail-relay-state
  mail-relay-spool:
    name: mail-relay-spool
