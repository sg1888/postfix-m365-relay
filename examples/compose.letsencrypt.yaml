# Overlay for a published relay with a Certbot-managed STARTTLS identity.
services:
  postfix-m365-relay:
    environment:
      MAIL_INBOUND_TLS_CERT: /etc/letsencrypt/live/smtp.example.com/fullchain.pem
      MAIL_INBOUND_TLS_KEY: /etc/letsencrypt/live/smtp.example.com/privkey.pem
    volumes:
      # Mount the whole tree: live/ entries are symlinks into archive/. An
      # individual file mount may retain an old inode after atomic renewal.
      - /etc/letsencrypt:/etc/letsencrypt:ro
