# Minimal local-Docker setup. No ports exposed to the host.
services:
  postfix-m365-relay:
    image: docker.io/sg1888/postfix-m365-relay:latest
    # For local builds, uncomment this instead:
    # build:
    #   context: ..
    #   dockerfile: build/postfix-m365-relay/Dockerfile
    # Set TZ in /config/mail-relay.conf (most portable). Bind /etc/localtime:ro
    # on compatible servers if you want server timezone but no TZ env var.
    restart: unless-stopped
    expose: ["2525"]
    volumes:
      - ../mail-relay:/config
      - mail-relay-state:/var/lib/mail-relay
      - mail-relay-spool:/var/spool/postfix
      # Optional server-timezone mount when TZ is not set:
      # - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /run/mail-relay:mode=0750
    networks: [mail-relay]
    healthcheck:
      test: ["CMD-SHELL", "printf 'QUIT\\r\\n' | nc -w 3 127.0.0.1 $${RELAY_PORT:-2525} | grep -q '^220 '"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  mail-relay:

volumes:
  mail-relay-state:
  mail-relay-spool:
