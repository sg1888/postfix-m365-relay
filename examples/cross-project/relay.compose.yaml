# Create the shared network once before starting this separate relay project:
# docker network create --driver bridge --subnet 172.30.50.0/24 mail-relay
services:
  postfix-m365-relay:
    image: docker.io/sg1888/postfix-m365-relay:latest
    container_name: postfix-m365-relay
    restart: unless-stopped
    expose: ["2525"]
    volumes:
      - ../../config:/config
      - mail-relay-state:/var/lib/mail-relay
      - mail-relay-spool:/var/spool/postfix
    tmpfs:
      - /run/mail-relay:rw,nosuid,noexec,mode=0750
    networks:
      mail-relay:
        aliases: [postfix-m365-relay]

networks:
  mail-relay:
    external: true
    name: mail-relay

volumes:
  mail-relay-state:
  mail-relay-spool:
