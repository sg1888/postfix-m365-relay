# Copy these blocks into an existing compose file. Attach each mail-sending app
# to both its normal network and `mail-relay`, then point to postfix-m365-relay:2525
# without SMTP credentials.
services:
  postfix-m365-relay:
    image: docker.io/sg1888/postfix-m365-relay:latest
    restart: unless-stopped
    expose: ["2525"]
    volumes:
      - ./mail-relay:/config
      - mail-relay-state:/var/lib/mail-relay
      - mail-relay-spool:/var/spool/postfix
    tmpfs: [/run/mail-relay]
    networks: [mail-relay]

  your-app:
    # ...the application's existing settings...
    environment:
      SMTP_HOST: postfix-m365-relay
      SMTP_PORT: 2525
      SMTP_FROM: app@relay.example.local
    networks:
      - default
      - mail-relay

networks:
  mail-relay:

volumes:
  mail-relay-state:
  mail-relay-spool:
